name: TEMP Upstream 0.10 Post-Merge Verification

on:
  push:
    branches:
      - automation/upstream-0.10.0-sync-20260828

permissions:
  contents: read

jobs:
  verify-linux:
    name: Verify merged main on Linux
    runs-on: ubuntu-latest
    outputs:
      main_sha: ${{ steps.identity.outputs.sha }}
    steps:
      - name: Checkout canonical fork main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Verify upstream ancestry and capture identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/jacob-bd/gemini-notebook-mcp-cli.git || true
          git fetch upstream main --tags
          test "$(git rev-parse upstream/main)" = "ba12caed94f7c33f694b15d56086f95af0dc4240"
          git merge-base --is-ancestor upstream/main HEAD
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --check
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9  # v7

      - name: Focused compatibility tests
        run: >-
          uv run --dev pytest -q
          tests/test_auth_browser.py
          tests/test_cdp_port_map.py
          tests/test_cdp_profile_owned_close.py
          tests/test_cdp_url_check.py
          tests/test_mcp_plugins.py
          tests/test_profile_aware_headless_auth.py
          tests/core/test_auth_check.py
          tests/test_base_url_resolution.py

      - name: Ruff lint
        run: uv run --dev ruff check . --output-format=github

      - name: Ruff format check
        run: uv run --dev ruff format --check .

      - name: Build package
        run: uv build

      - name: Full non-E2E suite on Linux
        run: uv run --dev --with pytest-github-actions-annotate-failures --with pytest-asyncio pytest -q -m "not e2e"

  verify-windows:
    name: Verify exact merged main on Windows
    needs: verify-linux
    runs-on: windows-latest
    steps:
      - name: Checkout exact verified main commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          ref: ${{ needs.verify-linux.outputs.main_sha }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9  # v7

      - name: Focused Windows compatibility tests
        run: >-
          uv run --dev pytest -q
          tests/test_auth_browser.py
          tests/test_cdp_port_map.py
          tests/test_cdp_profile_owned_close.py
          tests/test_cdp_url_check.py
          tests/test_mcp_plugins.py
          tests/test_profile_aware_headless_auth.py
          tests/core/test_auth_check.py
          tests/test_base_url_resolution.py

      - name: Ruff lint
        run: uv run --dev ruff check . --output-format=github

      - name: Ruff format check
        run: uv run --dev ruff format --check .

      - name: Build package
        run: uv build

      - name: Full non-E2E suite on Windows
        run: uv run --dev --with pytest-github-actions-annotate-failures --with pytest-asyncio pytest -q -m "not e2e"
