name: TEMP Upstream 0.10 Portability Repair Gate

on:
  push:
    branches:
      - automation/upstream-0.10.0-sync-20260828

permissions:
  contents: write

jobs:
  repair-linux:
    name: Repair and verify on Linux
    runs-on: ubuntu-latest
    outputs:
      repair_sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Checkout isolated repair branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          ref: fix/upstream-0.10-postmerge-portability-20260828
          fetch-depth: 0

      - name: Verify upstream ancestry
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/jacob-bd/gemini-notebook-mcp-cli.git || true
          git fetch upstream main --tags
          test "$(git rev-parse upstream/main)" = "ba12caed94f7c33f694b15d56086f95af0dc4240"
          git merge-base --is-ancestor upstream/main HEAD
          git diff --check

      - name: Repair Linux-portable Windows environment fixtures
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("tests/test_cdp_port_map.py")
          text = path.read_text(encoding="utf-8")
          old = 'monkeypatch.setenv("ProgramFiles",'
          new = 'monkeypatch.setenv("PROGRAMFILES",'
          count = text.count(old)
          if count != 2:
              raise SystemExit(f"expected 2 ProgramFiles fixtures, found {count}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          git diff --check

      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9  # v7

      - name: Focused compatibility tests
        run: >-
          uv run --dev pytest -q
          tests/test_auth_browser.py
          tests/test_cdp_port_map.py
          tests/test_cdp_profile_owned_close.py
          tests/test_cdp_url_check.py
          tests/test_mcp_plugins.py
          tests/test_profile_aware_headless_auth.py
          tests/core/test_auth_check.py
          tests/test_base_url_resolution.py

      - name: Ruff lint
        run: uv run --dev ruff check . --output-format=github

      - name: Ruff format check
        run: uv run --dev ruff format --check .

      - name: Build package
        run: uv build

      - name: Full non-E2E suite on Linux
        run: uv run --dev --with pytest-github-actions-annotate-failures --with pytest-asyncio pytest -q -m "not e2e"

      - name: Commit verified repair branch
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SanityCloud Integration Bot"
          git config user.email "actions@users.noreply.github.com"
          git add tests/test_cdp_port_map.py
          git commit -m "test: make PowerShell path fixtures portable across CI"
          git push origin HEAD:refs/heads/fix/upstream-0.10-postmerge-portability-20260828
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  verify-windows:
    name: Verify exact repair commit on Windows
    needs: repair-linux
    runs-on: windows-latest
    steps:
      - name: Checkout exact repair commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          ref: ${{ needs.repair-linux.outputs.repair_sha }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9  # v7

      - name: Focused Windows compatibility tests
        run: >-
          uv run --dev pytest -q
          tests/test_auth_browser.py
          tests/test_cdp_port_map.py
          tests/test_cdp_profile_owned_close.py
          tests/test_cdp_url_check.py
          tests/test_mcp_plugins.py
          tests/test_profile_aware_headless_auth.py
          tests/core/test_auth_check.py
          tests/test_base_url_resolution.py

      - name: Ruff lint
        run: uv run --dev ruff check . --output-format=github

      - name: Ruff format check
        run: uv run --dev ruff format --check .

      - name: Build package
        run: uv build

      - name: Full non-E2E suite on Windows
        run: uv run --dev --with pytest-github-actions-annotate-failures --with pytest-asyncio pytest -q -m "not e2e"
